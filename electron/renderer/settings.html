<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div id="wrap">
    <h1>Settings</h1>

    <label for="provider">Provider</label>
    <select id="provider">
      <option value="openai">OpenAI</option>
      <option value="anthropic">Anthropic</option>
      <option value="openai_compat">OpenAI-compatible</option>
    </select>

    <fieldset id="api-key-fieldset">
      <legend>API key</legend>
      <p id="key-status">Checking…</p>
      <label for="new-api-key">New API key (leave blank to keep the current one)</label>
      <input id="new-api-key" type="password" autocomplete="off" placeholder="Paste a new key here" />
      <p class="hint">The key is stored encrypted on this computer and is never shown again after saving.</p>
      <button id="clear-key" type="button" class="hidden">Remove my key and use the built-in one</button>
    </fieldset>

    <fieldset data-provider="openai">
      <legend>OpenAI</legend>
      <label for="openai-model">Model</label>
      <input id="openai-model" type="text" />
    </fieldset>

    <fieldset data-provider="anthropic">
      <legend>Anthropic</legend>
      <label for="anthropic-model">Model</label>
      <input id="anthropic-model" type="text" />
    </fieldset>

    <fieldset data-provider="openai_compat">
      <legend>OpenAI-compatible endpoint</legend>
      <label for="compat-url">Base URL</label>
      <input id="compat-url" type="text" placeholder="https://example.com/v1" />
      <label for="compat-model">Model</label>
      <input id="compat-model" type="text" />
    </fieldset>

    <label for="hotkey">Global hotkey</label>
    <input id="hotkey" type="text" placeholder="Control+Alt+K" />

    <label for="action-delay">Action pacing (seconds between actions)</label>
    <input id="action-delay" type="number" min="0" max="3" step="0.1" value="0.4" />

    <label for="pointer-glide">Pointer glide (seconds to travel to click targets)</label>
    <input id="pointer-glide" type="number" min="0" max="1" step="0.05" value="0.45" />

    <label class="check-row" for="cursor-overlay">
      <input id="cursor-overlay" type="checkbox" />
      Show agent cursor overlay while a task runs
    </label>

    <div id="buttons">
      <button id="save" class="primary">Save</button>
      <span id="toast" class="hidden">Saved</span>
    </div>
    <div id="error" class="hidden"></div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
